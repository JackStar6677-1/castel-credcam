name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  calidad:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar librerias de sistema Qt/EGL (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libdbus-1-3 libxcb-cursor0

      - name: Instalar dependencias
        run: python -m pip install --upgrade pip && pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: python -m ruff check .

      - name: Pruebas (pytest)
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest tests

      - name: Verificar que los modulos compilan
        run: |
          python -m py_compile castel_credcam.py photo_autoframe.py camera_diagnostic.py tools/audit_photo_quality.py tools/audit_roster_coverage.py
          python -m py_compile GUI/castel_credcam_qt.py
