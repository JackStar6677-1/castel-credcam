<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-labelledby="title desc">
  <title id="title">CastelCredCam Studio</title>
  <desc id="desc">Dark hero banner for CastelCredCam README with camera and workflow cues.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#121118"/>
      <stop offset="55%" stop-color="#17151e"/>
      <stop offset="100%" stop-color="#0d0c11"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" x2="1">
      <stop offset="0%" stop-color="#6a4a98"/>
      <stop offset="100%" stop-color="#c4b06a"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <style>
    @keyframes lensShutter {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.15); }
    }
    @keyframes indicatorBlink {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 1; }
    }
    @keyframes pulseNode {
      0%, 100% { transform: scale(0.9); opacity: 0.6; }
      50% { transform: scale(1.25); opacity: 1; }
    }
    @keyframes badgeFloat {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-4px); }
    }
    .lens-shutter {
      animation: lensShutter 4s infinite ease-in-out;
      transform-origin: 128px 118px;
    }
    .indicator-blink {
      animation: indicatorBlink 2s infinite ease-in-out;
    }
    .node-pulse-1 {
      animation: pulseNode 3s infinite ease-in-out;
      transform-origin: 1080px 70px;
    }
    .node-pulse-2 {
      animation: pulseNode 3s infinite ease-in-out;
      animation-delay: 1s;
      transform-origin: 1180px 170px;
    }
    .node-pulse-3 {
      animation: pulseNode 3s infinite ease-in-out;
      animation-delay: 2s;
      transform-origin: 1080px 270px;
    }
    .badge-float-1 {
      animation: badgeFloat 4s infinite ease-in-out;
    }
    .badge-float-2 {
      animation: badgeFloat 4s infinite ease-in-out;
      animation-delay: 0.8s;
    }
    .badge-float-3 {
      animation: badgeFloat 4s infinite ease-in-out;
      animation-delay: 1.6s;
    }
    .badge-float-4 {
      animation: badgeFloat 4s infinite ease-in-out;
      animation-delay: 2.4s;
    }
  </style>

  <rect width="1280" height="320" rx="30" fill="url(#bg)"/>
  <rect x="28" y="28" width="1224" height="264" rx="24" fill="#18161f" stroke="#352f45" stroke-width="2"/>

  <!-- Animated Camera / Shutter -->
  <g filter="url(#shadow)">
    <rect x="68" y="66" width="120" height="120" rx="26" fill="#231f2d" stroke="#6a4a98" stroke-width="3"/>
    <rect x="92" y="92" width="72" height="52" rx="10" fill="#0f0d13" stroke="#c4b06a" stroke-width="3"/>
    <!-- Outer lens element -->
    <circle cx="128" cy="118" r="16" fill="none" stroke="#c4b06a" stroke-width="4" class="lens-shutter"/>
    <!-- Inner lens core -->
    <circle cx="128" cy="118" r="6" fill="#c4b06a" class="lens-shutter"/>
    <rect x="99" y="149" width="58" height="14" rx="7" fill="#6a4a98"/>
    <!-- Flash indicator LED -->
    <circle cx="159" cy="104" r="6" fill="#c4b06a" class="indicator-blink"/>
  </g>

  <text x="220" y="118" fill="#f2eef7" font-family="Segoe UI, Arial, sans-serif" font-size="54" font-weight="700">
    CastelCredCam Studio
  </text>
  <text x="220" y="162" fill="#d8d1e0" font-family="Segoe UI, Arial, sans-serif" font-size="22">
    Captura por curso, roster, respaldo espejo y reencuadre automático
  </text>

  <!-- Flow badges -->
  <g font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="600">
    <g class="badge-float-1">
      <rect x="220" y="198" width="168" height="40" rx="20" fill="#231f2d" stroke="#6a4a98" stroke-width="2"/>
      <text x="304" y="224" text-anchor="middle" fill="#f2eef7">Qt principal</text>
    </g>

    <g class="badge-float-2">
      <rect x="404" y="198" width="182" height="40" rx="20" fill="#231f2d" stroke="#6a4a98" stroke-width="2"/>
      <text x="495" y="224" text-anchor="middle" fill="#f2eef7">Backup espejo</text>
    </g>

    <g class="badge-float-3">
      <rect x="602" y="198" width="204" height="40" rx="20" fill="#231f2d" stroke="#c4b06a" stroke-width="2"/>
      <text x="704" y="224" text-anchor="middle" fill="#f2eef7">Postprocess face crop</text>
    </g>

    <g class="badge-float-4">
      <rect x="822" y="198" width="182" height="40" rx="20" fill="#231f2d" stroke="#6fbfa5" stroke-width="2"/>
      <text x="913" y="224" text-anchor="middle" fill="#f2eef7">Roster por curso</text>
    </g>
  </g>

  <!-- Orbital Flow line and animated nodes -->
  <path d="M 1080 70 C 1140 70, 1180 110, 1180 170 C 1180 230, 1140 270, 1080 270" fill="none" stroke="url(#accent)" stroke-width="10" stroke-linecap="round"/>
  <circle cx="1080" cy="70" r="8" fill="#6a4a98" class="node-pulse-1"/>
  <circle cx="1180" cy="170" r="8" fill="#c4b06a" class="node-pulse-2"/>
  <circle cx="1080" cy="270" r="8" fill="#6fbfa5" class="node-pulse-3"/>

  <text x="1080" y="112" fill="#c4b06a" font-family="Segoe UI, Arial, sans-serif" font-size="18" text-anchor="middle">Windows</text>
  <text x="1180" y="182" fill="#c4b06a" font-family="Segoe UI, Arial, sans-serif" font-size="18" text-anchor="middle">Preview</text>
  <text x="1080" y="302" fill="#6fbfa5" font-family="Segoe UI, Arial, sans-serif" font-size="18" text-anchor="middle">Capture</text>
</svg>
